<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anlık Dublaj</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-card">
      <header class="header">
        <div class="brand">
          <img class="brand-logo" src="../icons/icon48.png" alt="" width="32" height="32" />
          <div class="brand-title">
            <h1>Anlık Dublaj</h1>
            <span class="badge" id="version-badge"></span>
          </div>
        </div>
      </header>

      <div class="master-toggle-container">
        <div class="toggle-info">
          <span class="toggle-title">Canlı Çeviri</span>
          <span class="toggle-desc" id="status-desc">Bu sekmedeki sesi çevirmek için açın</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="master-toggle" />
          <span class="slider round"></span>
        </label>
      </div>

      <div class="alert-box" id="api-alert" hidden>
        <span>⚠️ Gemini API anahtarı girilmedi.</span>
        <button class="alert-action-btn" id="go-to-key-btn">Anahtar Gir</button>
      </div>

      <div class="section">
        <div class="section-title"><span>Çeviri</span></div>

        <div class="control-row">
          <div class="control-label"><span>🌍 Hedef Dil</span></div>
          <select id="target-lang" class="custom-select"></select>
        </div>

        <div class="control-row">
          <div class="control-label">
            <span>🎵 Orijinal Ses</span>
            <span class="val-display" id="orig-vol-val">15%</span>
          </div>
          <div class="slider-wrapper">
            <input type="range" id="orig-vol-slider" min="0" max="100" value="15" />
            <button class="mute-btn" id="mute-orig-btn" title="Orijinal sesi kapat/aç">🔇</button>
          </div>
        </div>

        <div class="control-row">
          <div class="control-label">
            <span>🗣️ Çeviri Sesi</span>
            <span class="val-display" id="trans-vol-val">100%</span>
          </div>
          <div class="slider-wrapper">
            <input type="range" id="trans-vol-slider" min="0" max="100" value="100" />
          </div>
        </div>

        <div class="checkbox-row">
          <label>
            <input type="checkbox" id="show-overlay-checkbox" checked />
            <span>Video üzerinde altyazı kutusunu göster</span>
          </label>
        </div>
      </div>

      <div class="section collapsible">
        <div class="section-header-click" id="api-section-header">
          <div class="section-title">
            <span>🔑 <span lang="en">Gemini</span> API Anahtarı</span>
          </div>
          <span class="chevron collapsed" id="api-chevron">▼</span>
        </div>

        <div class="collapsible-content hidden" id="api-content">
          <div class="input-group">
            <div class="input-with-button">
              <input
                type="password"
                id="api-key-input"
                placeholder="AIzaSy..."
                autocomplete="off"
              />
              <button type="button" class="icon-toggle-btn" id="toggle-key-visibility">👁️</button>
            </div>
            <p class="field-hint">
              Anahtarınız yok mu?
              <a href="https://aistudio.google.com/api-keys" target="_blank" class="link"
                >Google AI Studio'dan alın ↗</a
              >
            </p>
          </div>
          <div class="button-group">
            <button class="primary-btn" id="save-key-btn">Kaydet & Doğrula</button>
          </div>
          <div class="key-status-message" id="key-status-msg"></div>
        </div>
      </div>

      <footer class="footer">
        <span>Kısayol: <kbd id="shortcut-key">Alt+Shift+D</kbd></span>
        <span class="active-dot" id="footer-dot"></span>
      </footer>
    </div>

    <script src="../shared/languages.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
